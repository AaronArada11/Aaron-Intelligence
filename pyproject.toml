[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aaron-intelligence"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "fastapi==0.128.8",
  "google-genai==1.14.0",
  "langfuse==4.12.0",
  "pydantic==2.13.4",
  "python-dotenv==1.2.1",
  "requests==2.32.5",
  "supabase==2.31.0",
  "uvicorn==0.39.0",
]

[project.scripts]
app = "api.chat:app"

[project.optional-dependencies]
dev = [
  "coverage[toml]==7.10.6",
  "httpx==0.28.1",
  "pytest==8.4.1",
  "pytest-cov==6.2.1",
]

[tool.vercel]
entrypoint = "api.chat:app"

[tool.setuptools]
py-modules = ["evaluate"]

[tool.setuptools.packages.find]
include = ["api*", "backend*", "evaluations*"]
exclude = ["frontend*", "graphify-out*", "supabase*", "tests*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "integration: requires an isolated migrated Supabase test project",
]

[tool.coverage.run]
branch = true
source = ["backend", "evaluations"]

[tool.coverage.report]
show_missing = true
skip_covered = true
